<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>காதல் பரிணாமம்</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #09070b;
            color: #f5eee5;
            font-family: Georgia, "Times New Roman", serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 28px 20px 40px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 500;
            margin: 0 0 24px;
            letter-spacing: 2px;
        }

        .artwork {
            width: 100%;
            border-radius: 4px;
            display: block;
            margin-bottom: 28px;
        }

        .play-button {
            border: 1px solid rgba(245, 238, 229, 0.5);
            background: rgba(255, 255, 255, 0.08);
            color: #f5eee5;
            border-radius: 50px;
            padding: 14px 32px;
            font-size: 16px;
            cursor: pointer;
        }

        .play-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .poem {
            margin-top: 40px;
            font-size: 18px;
            line-height: 1.9;
            white-space: pre-line;
        }

        audio {
            width: 100%;
            margin-top: 20px;
        }

        .footer {
            margin-top: 45px;
            font-size: 13px;
            opacity: 0.55;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>காதல் பரிணாமம்</h1>

    <!-- Your poster will go here -->
    <img class="artwork" src="poster.jpg" alt="காதல் பரிணாமம்">

    <button class="play-button" onclick="playSong()">
        ▶️ &nbsp; கேட்க
    </button>

    <audio id="song" controls>
        <source src="song.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <div class="poem">
        <!-- Your poem will go here -->
    </div>

    <div class="footer">
        Made with love
    </div>

</div>

<script>
    function playSong() {
        const song = document.getElementById("song");
        song.play();
    }
</script>

</body>
</html>
