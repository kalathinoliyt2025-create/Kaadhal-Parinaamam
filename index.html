<!DOCTYPE html>
<html lang="ta">
<head>

<title>காதல் பரிணாமம்</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    overflow: hidden;
}

body {
    background: #05050a;
    font-family: 'Kavivanar', cursive;
}

/* ENTIRE WEBSITE = POSTER */

.poster {
    position: relative;
    width: 100%;
    height: 100vh;

    background-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.08) 0%,
            rgba(0,0,0,0.03) 35%,
            rgba(0,0,0,0.35) 65%,
            rgba(0,0,0,0.78) 100%
        ),
        url("poster-desktop.jpg");

    background-size: cover;
    background-position: center;
    overflow: hidden;
}
    @media (min-width: 501px) {
    .poster {
        background-position: center 18%;
    }
}

/* A subtle cinematic darkening */

.poster::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            to bottom,
            transparent 0%,
            transparent 42%,
            rgba(0,0,0,0.18) 58%,
            rgba(0,0,0,0.60) 100%
        );
    pointer-events: none;
}

/* ---------------- TITLE ---------------- */

.title {
    position: absolute;
    z-index: 5;

    top: 7%;
    left: 50%;
    transform: translateX(-50%);

    width: 90%;

    text-align: center;

    font-size: clamp(30px, 6vw, 58px);
    font-weight: 700;
    letter-spacing: 1px;

    color: #fff7df;

    text-shadow:
        0 2px 4px rgba(0,0,0,0.9),
        0 0 12px rgba(255,210,140,0.35);
}

/* ---------------- LYRICS ---------------- */

.lyrics {
    position: absolute;
    z-index: 5;

    left: 8%;
    right: 8%;

    top: 48%;
    height: 28%;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;

    overflow: hidden;

    padding: 10px;
}

/* CURRENT TWO LINES */

.current-lyrics {
    font-size: clamp(19px, 4vw, 32px);
    line-height: 1.65;

    font-weight: 600;

    color: #fff9e8;

    text-shadow:
        0 2px 5px rgba(0,0,0,0.95),
        0 0 12px rgba(255,220,170,0.30);

    min-height: 100px;

    transition:
        opacity 0.5s ease,
        transform 0.5s ease;
}

/* NEXT LYRICS */

.upcoming {
    margin-top: 16px;

    font-size: clamp(14px, 3vw, 21px);
    line-height: 1.7;

    color: rgba(255,245,225,0.42);

    text-shadow:
        0 1px 4px rgba(0,0,0,0.9);

    transition: opacity 0.5s ease;
}

.upcoming div {
    margin: 1px 0;
}

/* ---------------- PLAYER ---------------- */

.player {
    position: absolute;
    z-index: 6;

    left: 8%;
    right: 8%;

    top: 78%;

    display: flex;
    align-items: center;
    gap: 14px;
}

.download-song {
    position: absolute;
    z-index: 6;

    top: 84%;
    left: 50%;
    transform: translateX(-50%);

    color: #F4A38A;
    text-decoration: none;

    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;

    opacity: 0.85;
}

.play-button {
    width: 48px;
    height: 48px;

    border: none;
    border-radius: 50%;

    background: #F4A38A;

    color: #2b1720;

    font-size: 17px;

    cursor: pointer;

    box-shadow:
        0 3px 15px rgba(0,0,0,0.45);

    flex-shrink: 0;
}

.progress-area {
    flex: 1;
}

.progress {
    width: 100%;
    height: 4px;

    appearance: none;

    background: rgba(255,255,255,0.38);

    border-radius: 10px;

    cursor: pointer;
}

.progress::-webkit-slider-thumb {
    appearance: none;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: #F4A38A;

    cursor: pointer;
}

.progress::-moz-range-thumb {
    width: 12px;
    height: 12px;

    border: none;
    border-radius: 50%;

    background: #F4A38A;

    cursor: pointer;
}

.time {
    margin-top: 7px;

    display: flex;
    justify-content: space-between;

    color: rgba(255,255,255,0.70);

    font-family: Arial, sans-serif;
    font-size: 11px;
}

/* ---------------- CREDITS ---------------- */

.credits {
    position: absolute;
    z-index: 5;

    left: 8%;
    right: 8%;

    top: 88%;

    display: flex;
    justify-content: center;
    gap: 28px;

    text-align: center;

    color: rgba(255,245,225,0.72);

.credit {

    flex-direction: column;
    gap: 4px;
}

.credit-label {
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;

    opacity: 0.55;
}

.credit-name {
    font-size: 12px;

/* ---------------- LOVE ---------------- */

    z-index: 5;

    bottom: 2.5%;
    left: 0;
    right: 0;

    text-align: center;

    font-family: Arial, sans-serif;

    font-size: 8px;
    letter-spacing: 2px;

    color: rgba(255,255,255,0.32);

    .love {

    }
}

</style>
</head>

/* ---------------------------------------
   PLAY / PAUSE
---------------------------------------- */

playButton.addEventListener("click", () => {

    if (audio.paused) {

        audio.play();

        playButton.textContent = "❚❚";

    } else {

        audio.pause();

        playButton.textContent = "▶️";
    }

});


/* ---------------------------------------
   AUDIO LOADED
---------------------------------------- */

audio.addEventListener("loadedmetadata", () => {

    durationDisplay.textContent =
        formatTime(audio.duration);

});


/* ---------------------------------------
   PROGRESS
---------------------------------------- */

audio.addEventListener("timeupdate", () => {

    const percent =
        (audio.currentTime / audio.duration) * 100;

    progress.value = percent;

    currentTimeDisplay.textContent =
        formatTime(audio.currentTime);

    updateLyrics(audio.currentTime);

});


progress.addEventListener("input", () => {

    audio.currentTime =
        (progress.value / 100) * audio.duration;

});


/* ---------------------------------------
   UPDATE LYRICS
---------------------------------------- */

function updateLyrics(time) {

    let active = lyrics[0];

    for (let i = 0; i < lyrics.length; i++) {

        if (time >= lyrics[i].time) {
            active = lyrics[i];
        } else {
            break;
        }

    }

    currentLyrics.innerHTML =
        active.current.join("<br>");

    upcomingLyrics.innerHTML =
        active.next
            .map(line => `<div>${line}</div>`)
            .join("");

}


/* ---------------------------------------
   TIME FORMAT
---------------------------------------- */

function formatTime(seconds) {

    if (!seconds || isNaN(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return `${minutes}:${secs}`;
}


/* ---------------------------------------
   RESET WHEN SONG ENDS
---------------------------------------- */

audio.addEventListener("ended", () => {

    playButton.textContent = "▶️";

    progress.value = 0;

});
